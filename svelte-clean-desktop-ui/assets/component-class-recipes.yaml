button:
  base: "inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50"
  variants:
    default: "bg-primary text-primary-foreground hover:bg-primary/90"
    outline: "border border-border bg-background text-foreground shadow-xs hover:border-muted-foreground/35 hover:bg-accent"
    ghost: "text-muted-foreground hover:bg-accent hover:text-foreground dark:hover:bg-accent/50"
    destructive: "text-destructive hover:bg-destructive/10 focus-visible:ring-destructive/20"
  sizes:
    xs: "h-6 gap-1 px-2 text-xs"
    sm: "h-8 gap-1.5 px-3"
    default: "h-9 px-4"
    icon-xs: "size-6"
    icon-sm: "size-8"
    icon: "size-9"

sidebar_row:
  base: "group flex min-h-7 w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-[13px] font-medium tracking-tight transition-colors"
  inactive: "text-sidebar-foreground/60 hover:bg-foreground/[0.055] hover:text-sidebar-foreground dark:hover:bg-foreground/[0.065]"
  active: "bg-[var(--ux-sidebar-accent)] text-sidebar-foreground"
  icon_inactive: "size-4 shrink-0 text-sidebar-foreground/35 group-hover:text-sidebar-foreground/55"
  icon_active: "size-4 shrink-0 text-sidebar-foreground"

project_card:
  outer: "overflow-hidden rounded-lg border border-sidebar-border/60 bg-sidebar-foreground/[0.025]"
  header: "group flex min-h-11 items-center gap-1.5 px-2 py-1.5 transition-colors hover:bg-foreground/[0.045]"
  active: "bg-[var(--ux-sidebar-accent)] ring-1 ring-inset ring-sidebar-border/80"
  child_area: "border-t border-sidebar-border/60 bg-background/35 py-1 pl-3 pr-1"
  metadata: "truncate text-[11px] leading-4 text-muted-foreground"

settings:
  nav_item: "flex h-8 items-center gap-2 rounded-md px-2 text-left text-[13px] font-medium tracking-tight transition-colors"
  nav_active: "bg-accent text-accent-foreground"
  nav_inactive: "text-muted-foreground hover:bg-accent/60 hover:text-foreground"
  content: "scrollbar-sleek min-h-0 flex-1 overflow-y-auto px-8 py-7"
  section_header: "flex flex-wrap items-start justify-between gap-4 border-b border-border/60 pb-5"
  section_body: "rounded-xl border border-border/50 bg-card/50 px-7 py-6 shadow-xs"
  row: "grid gap-1.5 py-3 first:pt-0 last:pb-0"
  control_row: "grid gap-3 py-3 md:grid-cols-[1fr_auto] md:items-center"

menu:
  content: "z-50 min-w-40 overflow-hidden rounded-lg border border-border/70 bg-popover p-1 text-popover-foreground shadow-md"
  item: "relative flex min-h-7 cursor-default select-none items-center gap-2 rounded-md px-2 py-1.5 text-xs outline-none transition-colors hover:bg-accent hover:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50"
  label: "px-2 py-1.5 text-[11px] font-medium text-muted-foreground"
  separator: "-mx-1 my-1 h-px bg-border/70"

tabs:
  segmented_list: "inline-flex h-9 w-fit items-center rounded-lg bg-muted p-[3px] text-muted-foreground"
  segmented_trigger: "inline-flex h-[calc(100%-1px)] items-center justify-center rounded-md px-2 py-1 text-sm font-medium text-foreground/60 hover:text-foreground data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow-sm"

